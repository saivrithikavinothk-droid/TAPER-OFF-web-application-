<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TAPER-OFF — one task at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #15120f;
    --surface: #1f1a15;
    --surface-raised: #292117;
    --wax: #f1e7d6;
    --wax-dim: #cfc3ac;
    --ember: #d9642e;
    --ember-dim: #7a3d20;
    --moss: #85916b;
    --rust: #8c4436;
    --rust-bright: #c15a45;
    --line: #372f26;
    --font-display: 'Newsreader', Georgia, serif;
    --font-ui: 'Archivo', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--wax); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  .app-shell { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .site-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--line); margin-bottom: 2.5rem; }
  .site-header-text h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.4rem, 5vw, 3.4rem); letter-spacing: -0.01em; margin: 0; }
  .tagline { font-family: var(--font-display); font-style: italic; font-size: 1.25rem; color: var(--wax-dim); margin: 0.25rem 0 0; }

  .candle { display: flex; flex-direction: column; align-items: center; width: 72px; flex-shrink: 0; }
  .candle-flame { width: 10px; height: 16px; margin-bottom: -2px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #ffd899 0%, var(--ember) 55%, var(--rust) 100%); animation: flicker 2.6s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { transform: scaleY(1) scaleX(1) rotate(0deg); } 30% { transform: scaleY(1.08) scaleX(0.95) rotate(-2deg); } 60% { transform: scaleY(0.94) scaleX(1.04) rotate(2deg); } }
  .candle-wax { position: relative; width: 48px; height: 96px; clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); background: var(--surface-raised); overflow: hidden; display: flex; align-items: flex-end; }
  .candle-fill { width: 100%; background: linear-gradient(180deg, var(--ember) 0%, var(--ember-dim) 100%); transition: height 0.5s ease; }
  .candle-label { font-size: 0.7rem; color: var(--wax-dim); text-align: center; margin: 0.5rem 0 0; max-width: 90px; line-height: 1.3; }

  .layout { display: grid; grid-template-columns: 1fr 1.15fr; gap: 3rem; }
  .column-heading { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0 0 1rem; }
  .column-heading-list { margin-top: 2.25rem; }
  .count { color: var(--wax-dim); font-weight: 400; }

  .focus-card { background: var(--surface); border: 1px solid var(--line); padding: 2rem; position: relative; }
  .focus-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--ember); }
  .focus-eyebrow { font-size: 0.85rem; color: var(--wax-dim); margin: 0 0 0.5rem; }
  .focus-title { font-family: var(--font-display); font-size: 1.9rem; font-weight: 500; line-height: 1.25; margin: 0 0 1.25rem; }
  .focus-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.75rem; }
  .tag { font-size: 0.8rem; padding: 0.25rem 0.65rem; border: 1px solid var(--line); color: var(--wax-dim); }
  .tag-important { color: var(--ember); border-color: var(--ember-dim); }
  .tag-overdue { color: var(--rust-bright); border-color: var(--rust); }
  .tag-today, .tag-soon { color: var(--ember); border-color: var(--ember-dim); }
  .focus-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .focus-empty-title { font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 0.4rem; }
  .focus-empty-copy { color: var(--wax-dim); margin: 0; }

  .btn { font-family: var(--font-ui); font-size: 0.9rem; font-weight: 600; padding: 0.65rem 1.25rem; border: 1px solid transparent; background: none; cursor: pointer; transition: opacity 0.15s ease, border-color 0.15s ease; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--ember); color: var(--ink); }
  .btn-primary:hover:not(:disabled) { background: #e8763f; }
  .btn-ghost { border-color: var(--line); color: var(--wax); }
  .btn-ghost:hover { border-color: var(--wax-dim); }
  .btn-danger { color: var(--rust-bright); border-color: var(--rust); }
  .btn-danger:hover { background: var(--rust); color: var(--wax); }
  .link-btn { background: none; border: none; color: var(--wax-dim); font-size: 0.8rem; text-decoration: underline; cursor: pointer; padding: 0; }
  .link-btn:hover { color: var(--ember); }

  .task-form { background: var(--surface); border: 1px solid var(--line); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field-label { font-size: 0.8rem; color: var(--wax-dim); }
  .field input[type='text'], .field input[type='date'] { background: var(--ink); border: 1px solid var(--line); color: var(--wax); padding: 0.65rem 0.75rem; font-size: 0.95rem; }
  .field input:focus { border-color: var(--ember); }
  .field-row { display: flex; gap: 1.25rem; align-items: flex-end; flex-wrap: wrap; }
  .field-deadline { flex: 1; min-width: 150px; }
  .field-check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; padding-bottom: 0.7rem; cursor: pointer; }

  .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .task-row { display: flex; align-items: center; gap: 0.75rem; }
  .task-bar { display: flex; align-items: center; gap: 0.6rem; background: var(--surface); border: 1px solid var(--line); padding: 0.7rem 1rem; clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); min-width: 0; transition: width 0.4s ease; }
  .task-checkbox { flex-shrink: 0; accent-color: var(--ember); width: 16px; height: 16px; }
  .task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; }
  .task-deadline { margin-left: auto; font-size: 0.75rem; color: var(--wax-dim); flex-shrink: 0; padding-right: 1rem; }
  .task-row-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--wax-dim); width: 30px; height: 30px; cursor: pointer; font-size: 0.75rem; line-height: 1; }
  .icon-btn:hover { border-color: var(--wax-dim); color: var(--wax); }
  .icon-btn-active { color: var(--ember); border-color: var(--ember-dim); }
  .icon-btn-danger:hover { color: var(--rust-bright); border-color: var(--rust); }
  .empty-note { color: var(--wax-dim); font-size: 0.9rem; }

  .done-block { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .done-block-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; }
  .done-block-header h3 { font-family: var(--font-display); font-weight: 500; font-size: 1rem; margin: 0; color: var(--moss); }
  .done-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .done-item { background: none; border: none; color: var(--wax-dim); text-decoration: line-through; font-size: 0.85rem; text-align: left; cursor: pointer; padding: 0.15rem 0; }
  .done-item:hover { color: var(--moss); }
  .done-check { color: var(--moss); text-decoration: none; display: inline-block; margin-right: 0.3rem; }

  .site-footer { margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--wax-dim); font-size: 0.8rem; }

  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; gap: 2.5rem; }
    .site-header { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
    .candle { align-self: flex-start; flex-direction: row; width: auto; gap: 0.75rem; }
    .candle-label { text-align: left; max-width: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const STORAGE_KEY = 'taper-off:tasks';

function loadInitialTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function useTasks() {
  const [tasks, setTasks] = useState(loadInitialTasks);
  const orderCounter = useRef(tasks.reduce((max, t) => Math.max(max, t.order ?? 0), 0));

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }, [tasks]);

  const addTask = useCallback((title, deadline, important) => {
    const trimmed = title.trim();
    if (!trimmed) return;
    orderCounter.current += 1;
    setTasks(prev => [...prev, {
      id: `${Date.now()}-${orderCounter.current}`,
      title: trimmed,
      deadline: deadline || null,
      important: Boolean(important),
      done: false,
      order: orderCounter.current,
    }]);
  }, []);

  const deleteTask = useCallback(id => setTasks(prev => prev.filter(t => t.id !== id)), []);
  const toggleImportant = useCallback(id => setTasks(prev => prev.map(t => t.id === id ? { ...t, important: !t.important } : t)), []);
  const toggleDone = useCallback(id => setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t)), []);
  const clearCompleted = useCallback(() => setTasks(prev => prev.filter(t => !t.done)), []);

  const activeTasks = useMemo(() => {
    return tasks.filter(t => !t.done).slice().sort((a, b) => {
      if (a.important !== b.important) return a.important ? -1 : 1;
      const ad = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const bd = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      if (ad !== bd) return ad - bd;
      return a.order - b.order;
    });
  }, [tasks]);

  const doneTasks = useMemo(() => tasks.filter(t => t.done).sort((a, b) => b.order - a.order), [tasks]);

  return { tasks, activeTasks, doneTasks, addTask, deleteTask, toggleImportant, toggleDone, clearCompleted };
}

function formatDeadline(deadline) {
  if (!deadline) return null;
  const date = new Date(`${deadline}T00:00:00`);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((date - today) / 86400000);
  const label = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  if (diffDays < 0) return { text: `Overdue · ${label}`, tone: 'overdue' };
  if (diffDays === 0) return { text: 'Due today', tone: 'today' };
  if (diffDays === 1) return { text: 'Due tomorrow', tone: 'soon' };
  return { text: `Due ${label}`, tone: 'normal' };
}

function shortDeadline(deadline) {
  if (!deadline) return null;
  return new Date(`${deadline}T00:00:00`).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function CandleProgress({ total, done }) {
  const percentRemaining = total === 0 ? 100 : Math.round(((total - done) / total) * 100);
  return (
    <div className="candle">
      <div className="candle-flame" style={{ opacity: total === 0 ? 0.3 : 1 }} />
      <div className="candle-wax">
        <div className="candle-fill" style={{ height: `${percentRemaining}%` }} />
      </div>
      <p className="candle-label">{total === 0 ? 'Add a task to light it' : `${percentRemaining}% left to taper off`}</p>
    </div>
  );
}

function FocusTask({ task, onDone, onDelete, remaining }) {
  if (!task) {
    return (
      <div className="focus-card">
        <p className="focus-empty-title">Nothing to taper right now.</p>
        <p className="focus-empty-copy">Add a task on the right and it will show up here — one at a time.</p>
      </div>
    );
  }
  const deadline = formatDeadline(task.deadline);
  return (
    <div className="focus-card">
      <p className="focus-eyebrow">Right now</p>
      <h2 className="focus-title">{task.title}</h2>
      <div className="focus-meta">
        {task.important && <span className="tag tag-important">Important</span>}
        {deadline && <span className={`tag tag-${deadline.tone}`}>{deadline.text}</span>}
        {remaining > 0 && <span className="tag">{remaining} more waiting</span>}
      </div>
      <div className="focus-actions">
        <button className="btn btn-primary" onClick={() => onDone(task.id)}>Mark done</button>
        <button className="btn btn-danger" onClick={() => onDelete(task.id)}>Delete</button>
      </div>
    </div>
  );
}

function TaskForm({ onAdd }) {
  const [title, setTitle] = useState('');
  const [deadline, setDeadline] = useState('');
  const [important, setImportant] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!title.trim()) return;
    onAdd(title, deadline, important);
    setTitle(''); setDeadline(''); setImportant(false);
  }

  return (
    <form className="task-form" onSubmit={handleSubmit}>
      <label className="field">
        <span className="field-label">What needs doing?</span>
        <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="Write the project README" maxLength={140} autoComplete="off" />
      </label>
      <div className="field-row">
        <label className="field field-deadline">
          <span className="field-label">Deadline (optional)</span>
          <input type="date" value={deadline} onChange={e => setDeadline(e.target.value)} />
        </label>
        <label className="field-check">
          <input type="checkbox" checked={important} onChange={e => setImportant(e.target.checked)} />
          <span>Mark important</span>
        </label>
      </div>
      <button type="submit" className="btn btn-primary" disabled={!title.trim()}>Add to the list</button>
    </form>
  );
}

function TaskRow({ task, index, onToggleImportant, onToggleDone, onDelete }) {
  const width = Math.max(46, 100 - index * 7);
  return (
    <li className="task-row">
      <div className="task-bar" style={{ width: `${width}%` }}>
        <input type="checkbox" className="task-checkbox" checked={task.done} onChange={() => onToggleDone(task.id)} />
        <span className="task-title">{task.title}</span>
        {task.deadline && <span className="task-deadline">{shortDeadline(task.deadline)}</span>}
      </div>
      <div className="task-row-actions">
        <button className={`icon-btn ${task.important ? 'icon-btn-active' : ''}`} onClick={() => onToggleImportant(task.id)} title="Mark important">▲</button>
        <button className="icon-btn icon-btn-danger" onClick={() => onDelete(task.id)} title="Delete task">✕</button>
      </div>
    </li>
  );
}

function TaskList({ tasks, onToggleImportant, onToggleDone, onDelete }) {
  if (tasks.length === 0) return <p className="empty-note">Your backlog is empty. Add a task above.</p>;
  return (
    <ul className="task-list">
      {tasks.map((task, index) => (
        <TaskRow key={task.id} task={task} index={index} onToggleImportant={onToggleImportant} onToggleDone={onToggleDone} onDelete={onDelete} />
      ))}
    </ul>
  );
}

function App() {
  const { tasks, activeTasks, doneTasks, addTask, deleteTask, toggleImportant, toggleDone, clearCompleted } = useTasks();
  const [current, ...upNext] = activeTasks;

  return (
    <div className="app-shell">
      <header className="site-header">
        <div className="site-header-text">
          <h1>TAPER-OFF</h1>
          <p className="tagline">One task at a time.</p>
        </div>
        <CandleProgress total={tasks.length} done={doneTasks.length} />
      </header>

      <main className="layout">
        <section className="column">
          <h2 className="column-heading">Focus</h2>
          <FocusTask task={current} remaining={upNext.length} onDone={toggleDone} onDelete={deleteTask} />

          {doneTasks.length > 0 && (
            <div className="done-block">
              <div className="done-block-header">
                <h3>Done ({doneTasks.length})</h3>
                <button className="link-btn" onClick={clearCompleted}>Clear done</button>
              </div>
              <ul className="done-list">
                {doneTasks.slice(0, 6).map(t => (
                  <li key={t.id}>
                    <button className="done-item" onClick={() => toggleDone(t.id)}>
                      <span className="done-check">✓</span> {t.title}
                    </button>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </section>

        <section className="column">
          <h2 className="column-heading">Add a task</h2>
          <TaskForm onAdd={addTask} />
          <h2 className="column-heading column-heading-list">
            Up next {upNext.length > 0 && <span className="count">({upNext.length})</span>}
          </h2>
          <TaskList tasks={upNext} onToggleImportant={toggleImportant} onToggleDone={toggleDone} onDelete={deleteTask} />
        </section>
      </main>

      <footer className="site-footer">
        <p>Built with React + hooks. Your tasks stay on this device.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
